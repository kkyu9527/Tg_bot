server:
  port: 9599

spring:
  application:
    name: tg-bot
  profiles:
    active: dev

  # 数据库配置（PostgreSQL）
  datasource:
    url: jdbc:postgresql://localhost:5432/tg_bot_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level --- [%thread] %logger{39} : %msg%n"
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF

# Telegram Bot 配置
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    owner-id: ${TELEGRAM_BOT_OWNER_ID:0}
    group-id: ${TELEGRAM_BOT_GROUP_ID:0}
    webhook-url: ${TELEGRAM_BOT_WEBHOOK_URL}
